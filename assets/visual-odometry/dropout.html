<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual odometry replay</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf9f6;
      --ink: #24282c;
      --muted: #555d62;
      --rule: #d4d5cf;
      --estimate: #20557f;
      --reference: #a34d28;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100% - 40px, 62rem); margin: 0 auto; padding: 34px 0; }
    h1 { margin: 0; font: normal clamp(1.8rem, 3.7vw, 2.55rem)/1.13 "STIX Two Text", Georgia, serif; overflow-wrap: anywhere; }
    h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    header p { margin: 7px 0 25px; color: var(--muted); }
    .playback {
      display: grid; grid-template-columns: 1fr 1fr;
      grid-template-areas: "camera path" "controls controls"; gap: 14px 30px;
      border-top: 1px solid var(--rule); padding-top: 14px;
    }
    figure { margin: 0; min-width: 0; }
    .camera-figure { grid-area: camera; }
    .path-figure { grid-area: path; }
    .figure-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
    #frame-label, #timing, dd { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    #frame-label, #timing { font-size: .84rem; }
    #frame-label, figcaption { color: var(--muted); }
    .view { display: block; width: 100%; aspect-ratio: 1.5; }
    #camera { background: #292c2e; object-fit: contain; }
    #plot { background: var(--paper); }
    #plot text { fill: var(--muted); font: 11px "Inter", sans-serif; }
    #axes line { stroke: var(--rule); stroke-width: .8; }
    #ref-line { stroke: var(--reference); stroke-width: 4.6; stroke-dasharray: 6 5; }
    #est-line { stroke: var(--estimate); stroke-width: 2.3; stroke-linejoin: round; }
    #ref-dot { fill: none; stroke: var(--reference); stroke-width: 2; }
    #est-dot { fill: var(--estimate); stroke: var(--paper); stroke-width: 1; }
    figcaption { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 12px; margin-top: 6px; font-size: .85rem; }
    #status { color: var(--ink); }
    #status.gap { color: var(--reference); }
    .key { display: inline-flex; align-items: center; gap: 6px; }
    .key::before { content: ""; width: 20px; border-top: 2px solid var(--estimate); }
    .reference-key::before { border-color: var(--reference); border-top-style: dashed; }
    .controls { grid-area: controls; display: flex; align-items: center; gap: 12px; }
    button {
      font: inherit; font-size: .9rem; color: var(--ink); background: #f3f2ed;
      border: 1px solid #a9aca7; border-radius: 3px; padding: 5px 12px; min-width: 4.3rem; cursor: pointer;
    }
    button:hover { background: #e9e9e2; }
    input[type=range] { flex: 1; min-width: 0; margin: 0; accent-color: var(--estimate); cursor: pointer; }
    :focus-visible { outline: 2px solid var(--estimate); outline-offset: 3px; }
    .measurements { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 30px; border-top: 1px solid var(--rule); margin-top: 18px; padding-top: 13px; }
    dl { margin: 6px 0 0; }
    dl > div { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: 2px 0; }
    dt { color: var(--muted); font-size: .88rem; }
    dd { text-align: right; margin: 0; font-size: .85rem; }
    footer { border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 10px; font-size: .84rem; color: var(--muted); }
    footer p { margin: 0; }
    code { font-family: var(--mono); font-size: .95em; }
    @media (max-width: 680px) {
      main { width: calc(100% - 32px); padding: 20px 0; }
      header p { margin-bottom: 16px; }
      .playback { grid-template-columns: 1fr; grid-template-areas: "camera" "controls" "path"; gap: 15px; }
      .measurements { grid-template-columns: 1fr; }
      .controls { gap: 8px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Visual odometry replay</h1>
    <p id="setup"></p>
  </header>

  <section class="playback" aria-label="Replay">
    <figure class="camera-figure">
      <div class="figure-head"><h2>Camera view</h2><span id="frame-label"></span></div>
      <img id="camera" class="view" alt="Camera frame with a sample of the accepted corner tracks marked">
      <figcaption><span id="status"></span><span id="support"></span></figcaption>
    </figure>

    <figure class="path-figure">
      <div class="figure-head"><h2>Path from the start</h2></div>
      <svg id="plot" class="view" viewBox="0 0 430 282" role="img" aria-label="Camera path in the XY plane with equal scales on both axes">
        <g id="axes"></g>
        <path id="ref-line" fill="none"></path>
        <path id="est-line" fill="none"></path>
        <circle id="ref-dot" r="6"></circle>
        <circle id="est-dot" r="3.8"></circle>
      </svg>
      <figcaption><span class="key">Camera estimate</span><span class="key reference-key" id="truth-key">Reference path</span></figcaption>
    </figure>

    <div class="controls">
      <button id="play" type="button">Play</button>
      <input id="scrub" type="range" min="0" step="1" aria-label="Replay frame">
      <output id="timing" for="scrub" aria-live="off"></output>
    </div>
  </section>

  <div class="measurements">
    <section>
      <h2>This frame</h2>
      <dl>
        <div><dt>X position</dt><dd id="x"></dd></div>
        <div><dt>Y position</dt><dd id="y"></dd></div>
        <div id="error-row"><dt>Position error</dt><dd id="error"></dd></div>
      </dl>
    </section>
    <section>
      <h2>Whole run</h2>
      <dl id="totals"></dl>
    </section>
  </div>

  <footer>
    <p><span id="sampling"></span> The CSV and run totals use every decoded frame.</p>
    <p id="gap-note" hidden>A gap leaves out any distance the camera covered before tracking picked back up.</p>
  </footer>
</main>

<script>
  "use strict";
  const byId = id => document.getElementById(id);
  const {title, summary, samples} = JSON.parse(byId("payload").textContent);
  const hasReference = samples[0].ref !== null;
  const unit = summary.unit;
  const last = samples.length - 1;
  const endTime = samples[last].time;

  document.title = title + " | Visual odometry";
  byId("title").textContent = title;
  if (hasReference) {
    byId("setup").textContent = "The simulated camera follows a 60 × 40 cm rectangle and ends where it started.";
  } else if (unit === "m") {
    byId("setup").textContent = "This recording starts at (0, 0). The scale is " + summary.pixels_per_metre + " pixels per metre.";
  } else {
    byId("setup").textContent = "This recording starts at (0, 0). Distances are in pixels.";
  }

  function distance(value, units) {
    if (units === "px") return value.toFixed(2) + " px";
    if (value < 0.01) return (value * 1000).toFixed(2) + " mm";
    if (value < 1) return (value * 100).toFixed(2) + " cm";
    return value.toFixed(2) + " m";
  }

  function addTotal(label, value) {
    const row = document.createElement("div");
    const term = document.createElement("dt");
    const amount = document.createElement("dd");
    term.textContent = label;
    amount.textContent = value;
    row.append(term, amount);
    byId("totals").append(row);
  }

  addTotal("Frame pairs tracked", summary.tracked + " of " + summary.pairs);
  addTotal("Estimated travel", summary.estimated_distance.toFixed(unit === "m" ? 4 : 2) + " " + unit);
  if (hasReference) {
    addTotal("Reference travel", distance(summary.reference_distance_m, "m"));
    addTotal("Position RMSE", distance(summary.rmse_m, "m"));
    addTotal("Endpoint error", distance(summary.endpoint_error_m, "m"));
  } else {
    addTotal("Final displacement", distance(Math.hypot(...summary.final_xy), unit));
    addTotal("Rejected pairs", String(summary.rejected));
    byId("error-row").hidden = true;
    byId("truth-key").hidden = true;
    byId("ref-dot").setAttribute("visibility", "hidden");
  }
  const fps = Number(summary.fps.toFixed(2));
  byId("sampling").textContent = "Showing " + samples.length + " of " + summary.frames + " frames from the " + fps + " fps recording.";
  byId("gap-note").hidden = summary.rejected === 0;

  const points = samples.flatMap(s => hasReference ? [s.xy, s.ref] : [s.xy]);
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys), ymax = Math.max(...ys);
  const plot = {x: 49, y: 14, w: 368, h: 220};
  const minSpan = unit === "m" ? 0.025 : 5;
  const scale = 0.84 * Math.min(plot.w / Math.max(xmax - xmin, minSpan), plot.h / Math.max(ymax - ymin, minSpan));
  const midX = (xmin + xmax) / 2, midY = (ymin + ymax) / 2;
  const X = x => plot.x + plot.w / 2 + (x - midX) * scale;
  const Y = y => plot.y + plot.h / 2 - (y - midY) * scale;
  const point = p => X(p[0]).toFixed(2) + " " + Y(p[1]).toFixed(2);

  function axisElement(tag, attrs, text) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [key, val] of Object.entries(attrs)) node.setAttribute(key, val);
    if (text !== undefined) node.textContent = text;
    byId("axes").append(node);
  }
  const targetTick = 46 / scale;
  const power = 10 ** Math.floor(Math.log10(targetTick));
  const tick = [1, 2, 5, 10].map(n => n * power).find(n => n >= targetTick);
  const decimals = Math.max(0, -Math.floor(Math.log10(tick) + 1e-10));
  const xLo = midX - plot.w / (2 * scale), xHi = midX + plot.w / (2 * scale);
  const yLo = midY - plot.h / (2 * scale), yHi = midY + plot.h / (2 * scale);
  for (let k = Math.ceil(xLo / tick); k <= Math.floor(xHi / tick); k++) {
    const value = k * tick;
    axisElement("line", {x1: X(value), x2: X(value), y1: plot.y, y2: plot.y + plot.h});
    axisElement("text", {x: X(value), y: plot.y + plot.h + 17, "text-anchor": "middle"}, value.toFixed(decimals));
  }
  for (let k = Math.ceil(yLo / tick); k <= Math.floor(yHi / tick); k++) {
    const value = k * tick;
    axisElement("line", {x1: plot.x, x2: plot.x + plot.w, y1: Y(value), y2: Y(value)});
    axisElement("text", {x: plot.x - 7, y: Y(value) + 4, "text-anchor": "end"}, value.toFixed(decimals));
  }
  axisElement("text", {x: plot.x + plot.w / 2, y: 274, "text-anchor": "middle"}, "X (" + unit + ")");
  axisElement("text", {transform: "translate(12 124) rotate(-90)", "text-anchor": "middle"}, "Y (" + unit + ")");
  if (hasReference) {
    byId("ref-line").setAttribute("d", samples.map((s, i) => (i ? "L" : "M") + point(s.ref)).join(" "));
  }

  const statuses = {
    start: "First frame", tracked: "Tracking", low_texture: "Too little texture",
    lost_tracks: "Lost the tracks", inconsistent_flow: "Tracks disagree",
    limited_coverage: "Tracks cover too little of the image"
  };
  const scrub = byId("scrub"), play = byId("play");
  let index = last, playing = false, request = 0, started = 0;
  scrub.max = String(last);

  function moveDot(id, xy) {
    byId(id).setAttribute("cx", X(xy[0]));
    byId(id).setAttribute("cy", Y(xy[1]));
  }

  function coordinate(value) {
    return (Math.abs(value) < 0.0005 ? 0 : value).toFixed(3) + " " + unit;
  }

  function draw(i) {
    index = i;
    scrub.value = String(i);
    const s = samples[i];
    byId("camera").src = "data:image/jpeg;base64," + s.jpeg;
    byId("frame-label").textContent = "Frame " + s.frame;
    const path = samples.slice(0, i + 1).map((v, k) => {
      const sameSegment = k > 0 && v.segment === samples[k - 1].segment;
      return (sameSegment ? "L" : "M") + point(v.xy);
    });
    byId("est-line").setAttribute("d", path.join(" "));
    moveDot("est-dot", s.xy);
    if (hasReference) {
      moveDot("ref-dot", s.ref);
      byId("error").textContent = distance(Math.hypot(s.xy[0] - s.ref[0], s.xy[1] - s.ref[1]), "m");
    }
    const gap = s.status !== "tracked" && s.status !== "start";
    byId("status").textContent = (statuses[s.status] || s.status) + (gap ? ". Holding the last position." : "");
    byId("status").classList.toggle("gap", gap);
    const support = s.detected ? s.inliers + " of " + s.detected + " corners accepted." : "No corners detected.";
    byId("support").textContent = s.status === "start" ? "" : support;
    byId("x").textContent = coordinate(s.xy[0]);
    byId("y").textContent = coordinate(s.xy[1]);
    byId("timing").textContent = s.time.toFixed(2) + " / " + endTime.toFixed(2) + " s";
    scrub.setAttribute("aria-valuetext", "Frame " + s.frame + ", " + s.time.toFixed(2) + " seconds");
  }

  function stop() {
    playing = false;
    cancelAnimationFrame(request);
    play.textContent = "Play";
  }
  function tickFrame(now) {
    const time = (now - started) / 1000;
    let next = index;
    while (next < last && samples[next + 1].time <= time) next++;
    if (next !== index) draw(next);
    if (index === last) stop();
    else request = requestAnimationFrame(tickFrame);
  }
  play.addEventListener("click", () => {
    if (playing) { stop(); return; }
    if (index === last) draw(0);
    playing = true;
    play.textContent = "Pause";
    started = performance.now() - samples[index].time * 1000;
    request = requestAnimationFrame(tickFrame);
  });
  scrub.addEventListener("input", () => { stop(); draw(Number(scrub.value)); });
  draw(last);
</script>
</body>
</html>
